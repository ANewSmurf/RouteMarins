<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="popup.css">
</head>

<body>
    <div class="container">
        <div class="table-wrap table-thead-fixed">
            <table>
                <thead>
                    <tr>
                      <th title="Date">Day</th>
                      <th title="Time">Time</th>
                      <th title="Windy direct access with clic - correct time, correct position, correct model (GFS)">clic for Windy</th>
                      <th title="Elapsed Time from Now">fromNow</th>
                      <th title="True Wind Direction">TWD</th>
                      <th title="Wind Rotation angle in degree per hour - color box means high wind rotation > 5°/h">WRot</th>
                      <th title="True Wind Speed - click for toxxct polar direct access">TWS</th>
                      <th title="Speed over Ground - Color means foil is active">SOG</th>
                      <th title="Sail">Sail</th>
                      <th title="True Wind Angle">TWA</th>
                      <th title="average True Wind Angle - sliding &pm;2h window - (nb included before, nb included after)">avTWA</th>
                      <th title="Cap over Ground / Heading">COG</th>
                      <th title="Average Cap over Ground / Heading">avCOG</th>
                    </tr>
                </thead>
                <tbody id="pointsTable" align="center">
                </tbody>
            </table>
        </div>
        <br>
        <div id="localtimeDiv" style="margin-top: -15px" title="enable to display day&time in local timezone">
            <label for="localtime">Local Time</label>
            <input type="checkbox" id="localtime" tabindex="-1">
        </div>
        <div id="versionDiv" style="margin-top: -15px">
            <label>Version</label>
            <label id="version"></label>
        </div>
        <div id="gpxDiv" style="margin-top: -15px">
            <label for="gpxExport">Generate</label>
            <input class="cssButton" type="button" id="gpxExport" value=".GPX" tabindex="-1" title="generate GPX content">
            <input class="cssButton" type="button" id="kmlExport" value=".KML" tabindex="-1" title="generate KML content for windy route import with details">
            <label for="twaProg">Prog</label>
            <input class="cssButton" type="button" id="twaProg" value="TWA" tabindex="-1" title="generate prog based on twa - true wind angle">
            <input class="cssButton" type="button" id="avTwaProg" value="avTWA" tabindex="-1" title="generate prog based on average Twa">
            <input class="cssButton" type="button" id="cogProg" value="COG" tabindex="-1" title="generate prog based on cap over ground">
            <input class="cssButton" type="button" id="avCogProg" value="avCOG" tabindex="-1" title="generate prog based on average COG - cap over ground">
        </div>
        <br>
        <textarea id="gpxKmlOutput" rows="2" tabindex="-1" style="margin-top: -15px; width: 100%">...::: Click on GPX / KML / Prog buttons above to generate content :::...
It is copied ! | Paste in text editor | Save file with .gpx / .kml | Import where desired</textarea>
    </div>
</body>
<script src="bundle.js"></script>
<script src="resizeTables.js"></script>

</html>
